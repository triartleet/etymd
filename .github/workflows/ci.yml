# Activates when the repo gains a GitHub remote. Mirrors the local pre-push gate + build.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # etymd guards its own instructions with etymd. The README tells users to gate CI on this
      # exact command; a truth guard that does not run on itself is the thing it exists to catch.
      - name: etymd audit (self)
        run: node dist/cli.js audit --no-ledger --fail-on risk
      # The publish artifact, proven on every push rather than first attempted on release day.
      # The class this guards is real: packagers ignore .gitignore, so a stray local file can
      # ship in a release while every git-scoped check stays green. Asserting the exact top-level
      # manifest of the tarball catches any addition — file or directory — before it is permanent.
      - name: pack dry-run (what would ship)
        run: |
          npm pack --pack-destination /tmp >/dev/null
          tar -tzf /tmp/etymd-*.tgz | sed 's|^package/||' | cut -d/ -f1 | sort -u > /tmp/shipped
          printf 'CHANGELOG.md\nLICENSE\nREADME.md\ndist\npackage.json\n' > /tmp/expected
          diff /tmp/expected /tmp/shipped || {
            echo "::error::tarball contents differ from the expected manifest above"; exit 1; }
