# Activates when the repo gains a GitHub remote. Mirrors the local pre-push gate + build.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # etymd guards its own instructions with etymd. The README tells users to gate CI on this
      # exact command; a truth guard that does not run on itself is the thing it exists to catch.
      - name: etymd audit (self)
        run: node dist/cli.js audit --no-ledger --fail-on risk
